# This directory needs the opposite of what the root pytest.ini asks for, so it
# says so here rather than through flags on a command line.
#
# `pytest tests_ha` finds this file before the one at the root, which means a
# run by hand is the same run CI makes -- no `-o addopts=""` to remember, and
# no way for the two to drift apart.
[pytest]

# The root file names `pytest-homeassistant-custom-component` out, because the
# standalone suite must not have it. Here it is the whole point, so nothing is
# disabled.

# Required by that plugin, and not defaulted. Without it every test errors
# rather than failing: pytest 9 turned the deprecation for an unhandled async
# fixture into an error, and the plugin's autouse fixtures are async.
asyncio_mode = auto

# `python -m pytest` puts the working directory on the path and a bare `pytest`
# does not, so `custom_components` imports locally and goes missing in CI.
pythonpath = ..
