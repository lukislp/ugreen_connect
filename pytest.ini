[pytest]
testpaths = tests

# These tests load session.py and protocol.py straight from their source, with
# no Home Assistant anywhere near them -- which is the whole reason those two
# modules are kept free of it. pytest-homeassistant-custom-component is not a
# dependency of this repository, but it is one of other custom-component
# checkouts, and a single environment shared with one of those is enough: its
# plugin takes over the event loop policy and blocks sockets for every test
# collected, so all of them error before a line of ours runs. Naming it here
# keeps whether the suite passes a property of this repository rather than of
# what else the machine happens to have installed. Harmless where the plugin is
# absent, which is what CI is.
addopts = -p no:homeassistant
